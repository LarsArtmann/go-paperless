name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check (build, test, lint, format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  gosec:
    name: gosec (parked until a Go 1.27-capable gosec release)
    runs-on: ubuntu-24.04
    steps:
      # Parked 2026-10-11: gosec v2.29.0, the latest release, cannot
      # type-check this module. Its x/tools reads export data up to
      # version 4, while Go 1.27 compilers emit version 5, so every
      # stdlib import fails ("export data version 5 is greater than
      # maximum supported version 4") and the run exits 1 over "Golang
      # errors" with Issues: 0. A scanner that cannot load the module
      # measured nothing; per the fail-closed rule it must not gate.
      # Restore the scan step when gosec ships a release whose x/tools
      # understands Go 1.27 export data, and verify locally first:
      #   GOEXPERIMENT=jsonv2 go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...
      - run: |
          echo "::notice::gosec parked: latest gosec (v2.29.0) cannot read Go 1.27 export data (version 5 > maximum 4), so the scan type-checks nothing on this module. Restore when a go1.27-capable gosec release ships. Security coverage continues via the govulncheck, golangci-lint, race, and fuzz jobs."

  test-race:
    name: test-race
    runs-on: ubuntu-24.04
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  api-compatibility:
    name: api-diff vs newest tag (breaking changes must be intentional)
    runs-on: ubuntu-24.04
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gorelease resolves the newest tag as its comparison base and
          # refuses a shallow clone (no tag history, no comparison).
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # gorelease reports breaking changes in the report but exits 0, so
      # the gate greps the report instead of trusting the exit code. An
      # intentional break (the compatibility contract allows shipping one
      # as a 0.x minor) skips the gate when the HEAD commit message
      # carries the [api-break] marker — the release commit is then the
      # documented re-baseline point.
      - run: |
          if git log -1 --pretty=%B | grep -q '\[api-break\]'; then
            echo "::notice::HEAD commit declares an intentional API break ([api-break] marker) — gate skipped; ship as a 0.x minor."
            exit 0
          fi
          report=$(GOFLAGS= go run golang.org/x/exp/cmd/gorelease@latest -base="$(git describe --tags --abbrev=0)")
          echo "$report"
          if echo "$report" | grep -q '^## incompatible changes'; then
            echo "::error::Breaking API changes vs $(git describe --tags --abbrev=0). Ship them as an intentional 0.x minor: mark the release commit with [api-break]."
            exit 1
          fi

  fuzz:
    name: fuzz smoke (2m per target)
    runs-on: ubuntu-24.04
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # go test fuzzes one target per invocation; a failing input is
      # written to the target's testdata/fuzz/ so the upload below
      # captures it for diagnosis.
      - run: |
          go test -run '^$' -fuzz '^FuzzParseRetryAfter$' -fuzztime 2m .
          go test -run '^$' -fuzz '^FuzzParseDocumentCreated$' -fuzztime 2m .
          go test -run '^$' -fuzz '^FuzzDecodeSavedViewPayload$' -fuzztime 2m .
          go test -run '^$' -fuzz '^FuzzDecodeShareLinkPayload$' -fuzztime 2m .
          go test -run '^$' -fuzz '^FuzzChecksumFrom$' -fuzztime 2m .
          go test -run '^$' -fuzz '^FuzzClassifyTask$' -fuzztime 2m .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fuzz-crash-corpus
          path: |
            testdata/fuzz/
            paperlesstest/testdata/fuzz/
          if-no-files-found: ignore
