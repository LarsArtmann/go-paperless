# go-paperless requires Go >= 1.27 (encoding/json/v2 is the default there)
# while the machine's default `go` is older with GOTOOLCHAIN=local pinned
# host-wide. Auto-switching to the module's toolchain is a module concern
# (the same pin .crushrc applies to the LSP servers), so BuildFlow tool
# subprocesses get it here instead of a host-wide override.
env:
  GOTOOLCHAIN: auto
